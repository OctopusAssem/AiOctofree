name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore signing keystore
        env:
          AIOCTOFREE_KEYSTORE_B64: ${{ secrets.AIOCTOFREE_KEYSTORE_B64 }}
        run: |
          mkdir -p app/keystore
          printf '%s' "$AIOCTOFREE_KEYSTORE_B64" | base64 -d > app/keystore/aioctofree.p12

      - name: Build release APK
        env:
          AIOCTOFREE_STORE_PASSWORD: ${{ secrets.AIOCTOFREE_KEYSTORE_PASSWORD }}
          AIOCTOFREE_KEY_PASSWORD: ${{ secrets.AIOCTOFREE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apksigner_path=""
          for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [ -x "$candidate" ]; then apksigner_path="$candidate"; fi
          done
          test -n "$apksigner_path"
          apk=$(printf '%s\n' app/build/outputs/apk/release/*.apk)
          "$apksigner_path" verify --verbose "$apk"

      - name: Show APK info
        run: |
          ls -l app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/*.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioctofree-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6-build-${{ github.run_number }}
          name: AiOctofree 0.1.6 (build ${{ github.run_number }})
          body: |
            AiOctofree 0.1.6 — signed Android update.
            - Dark mode is now the default on first launch; users can still choose light or system mode.
            - Replaced the busy APK/launcher art with a clean octopus icon designed for small sizes.
            - Official in-app credit: Idea and design by Assem Hussein · OctopusAssem.
            - Tapping the version in Settings opens the developer's official GitHub profile.
            - Higher Android version code so this release installs over 0.1.5.
            - Groq, Gemini, and OpenRouter chat with your own API keys.
            - Encrypted on-device keys and a local conversation archive.
            - Question guide, welcome screen, and saved appearance choice.
            - The original full illustration remains in the project page; the APK has a purpose-made compact icon.
            - APK signature verified before publishing.
            Read README.md for the full guide and CHANGELOG.md for release history.
            Open source · Apache-2.0 · by OctopusAssem
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
